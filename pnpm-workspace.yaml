# Настройки pnpm (pnpm 11 читает их из этого файла, а не из .npmrc).

# Install-скрипты зависимостей по умолчанию заблокированы; каждый указывается явно.
allowBuilds:
  # Готовые бинарники приходят из @parcel/watcher-<platform>; сборка из исходников не нужна.
  # Install-скрипты Firebase лишь выводят уведомление или скачивают необязательные инструменты.
  '@firebase/util': false
  '@parcel/watcher': false
  protobufjs: false
  # postinstall лишь переключает сборки Vue 2 / Vue 3; сборка по умолчанию уже рассчитана на Vue 3.
  vue-demi: false
