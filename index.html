<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#059669" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%VITE_APP_TITLE% — тренажёр собеседования по фронтенду" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      // Применяем тёмную тему до первой отрисовки, чтобы не было вспышки светлой.
      // Синхронизировать с src/features/toggle-theme/config/theme.ts (ключ хранилища, имя класса).
      try {
        var mode = localStorage.getItem('app:theme')
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('app-dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
